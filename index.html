<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blow the Candles</title>

<style>
:root {
    --pink-1: #fff2f7;
    --pink-2: #ffc5d8;
    --pink-3: #ef719a;
    --cake: #d9785f;
    --cake-dark: #a84c43;
    --cream: #fff9f0;
    --chocolate: #7b3e32;
    --gold: #f6c85f;
    --text: #ffffff;
}

* { box-sizing: border-box; }

body {
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.9) 0 2%, transparent 20%),
        radial-gradient(circle at 15% 85%, rgba(255,255,255,.35) 0 1%, transparent 18%),
        linear-gradient(145deg, #e96794, #ffb3ca 52%, #ffdce8);
}

.container {
    width: min(94vw, 650px);
    text-align: center;
    position: relative;
    z-index: 2;
}

h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.7rem);
    letter-spacing: -.04em;
    text-shadow: 0 4px 16px rgba(101, 24, 58, .35);
}

.subtitle {
    margin: 10px 0 8px;
    font-size: clamp(1rem, 2.8vw, 1.25rem);
    opacity: .96;
}

.cake-scene {
    position: relative;
    width: 430px;
    height: 455px;
    max-width: 100%;
    margin: 0 auto -22px;
    transform-origin: bottom center;
}

.plate-shadow {
    position: absolute;
    left: 50%;
    bottom: 13px;
    width: 335px;
    height: 34px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(91, 23, 44, .22);
    filter: blur(10px);
}

.plate {
    position: absolute;
    left: 50%;
    bottom: 22px;
    width: 360px;
    height: 48px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: linear-gradient(#ffffff, #e7d9df 72%, #c4abb5);
    box-shadow: inset 0 8px 10px rgba(255,255,255,.95), 0 12px 18px rgba(97, 28, 51, .2);
}

.plate::after {
    content: "";
    position: absolute;
    inset: 9px 32px;
    border: 3px solid rgba(228, 111, 150, .45);
    border-radius: 50%;
}

.tier {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    overflow: visible;
    border-radius: 18px 18px 25px 25px;
    background:
        radial-gradient(circle at 15px 18px, rgba(255,255,255,.18) 0 2px, transparent 3px) 0 0 / 24px 25px,
        radial-gradient(circle at 8px 10px, rgba(112,53,41,.12) 0 1px, transparent 2px) 0 0 / 19px 17px,
        linear-gradient(90deg, var(--cake-dark), var(--cake) 17%, #e99476 52%, var(--cake) 84%, var(--cake-dark));
    box-shadow: inset 0 8px 10px rgba(255,255,255,.14), inset 0 -12px 12px rgba(104,42,39,.16), 0 10px 15px rgba(94,27,47,.18);
}

.tier-bottom { bottom: 57px; width: 310px; height: 116px; }
.tier-middle { bottom: 153px; width: 242px; height: 94px; }
.tier-top { bottom: 232px; width: 174px; height: 77px; }

.frosting {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    height: 25px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #fffefb 30%, #f9e6df 74%, #eacbc6);
    box-shadow: 0 5px 7px rgba(104,46,45,.18), inset 0 4px 6px rgba(255,255,255,.9);
    z-index: 3;
}

.frosting-bottom { bottom: 157px; width: 312px; }
.frosting-middle { bottom: 237px; width: 244px; }
.frosting-top { bottom: 303px; width: 176px; }

.drip-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    height: 17px;
    border-radius: 50%;
    background: linear-gradient(#9b5140, var(--chocolate));
}

.drip-bottom { bottom: 158px; width: 285px; }
.drip-middle { bottom: 238px; width: 218px; }

.drip {
    position: absolute;
    z-index: 3;
    background: linear-gradient(90deg, #6b302c, #995043 50%, #70332d);
    border-radius: 0 0 12px 12px;
}

.db1 { left: 94px; bottom: 130px; width: 15px; height: 35px; }
.db2 { left: 157px; bottom: 137px; width: 19px; height: 28px; }
.db3 { left: 248px; bottom: 126px; width: 13px; height: 40px; }
.dm1 { left: 127px; bottom: 214px; width: 14px; height: 29px; }
.dm2 { left: 213px; bottom: 219px; width: 13px; height: 25px; }

.pearls {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 4px;
    z-index: 5;
}

.pearls span {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 27%, white 0 15%, #fff5ed 32%, #eacac0 100%);
    box-shadow: 0 2px 3px rgba(101,45,44,.18);
}

.pearls-bottom { bottom: 151px; width: 292px; }
.pearls-middle { bottom: 232px; width: 224px; }
.pearls-top { bottom: 298px; width: 156px; }

.strawberry {
    position: absolute;
    z-index: 8;
    width: 26px;
    height: 32px;
    border-radius: 50% 50% 58% 58%;
    background:
        radial-gradient(circle at 28% 35%, #ffd3d5 0 1px, transparent 2px) 0 0 / 8px 8px,
        linear-gradient(135deg, #ff7990, #c7184d 72%);
    transform: rotate(12deg);
    box-shadow: inset -4px -4px 5px rgba(111, 4, 31, .2), 0 3px 4px rgba(92, 27, 43, .22);
}

.strawberry::before {
    content: "";
    position: absolute;
    top: -7px;
    left: 4px;
    width: 19px;
    height: 11px;
    background: #4e9c58;
    clip-path: polygon(50% 100%, 0 0, 42% 22%, 50% 0, 58% 22%, 100% 0);
}

.s1 { left: 118px; bottom: 300px; }
.s2 { left: 283px; bottom: 157px; transform: rotate(-13deg) scale(.9); }
.s3 { left: 85px; bottom: 158px; transform: rotate(18deg) scale(.78); }

.macaron {
    position: absolute;
    z-index: 7;
    width: 33px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(#e994b2 0 40%, #fff8ef 41% 58%, #d75f8e 59%);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.55), 0 3px 4px rgba(90,31,47,.2);
}

.m1 { left: 270px; bottom: 298px; transform: rotate(-12deg); }
.m2 { left: 169px; bottom: 156px; transform: rotate(10deg) scale(.9); }

.gold-dot {
    position: absolute;
    z-index: 8;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #fff7b0, var(--gold) 57%, #c58a24);
}

.g1 { left: 145px; bottom: 267px; }
.g2 { left: 228px; bottom: 267px; }
.g3 { left: 118px; bottom: 117px; }
.g4 { left: 263px; bottom: 112px; }

.candle {
    position: absolute;
    z-index: 10;
    bottom: 310px;
    width: 18px;
    height: 76px;
    border-radius: 6px;
    background: repeating-linear-gradient(135deg, #fff3c4 0 6px, #ef7c9e 6px 12px);
    box-shadow: inset 3px 0 2px rgba(255,255,255,.65), inset -3px 0 3px rgba(128,39,65,.2), 0 3px 4px rgba(89,26,44,.22);
}

.c1 { left: 146px; transform: rotate(-3deg); }
.c2 { left: 206px; height: 87px; bottom: 310px; }
.c3 { left: 266px; transform: rotate(3deg); }

.wick {
    position: absolute;
    top: -9px;
    left: 50%;
    width: 3px;
    height: 12px;
    transform: translateX(-50%);
    background: #382629;
    border-radius: 2px;
}

.flame {
    position: absolute;
    top: -43px;
    left: 50%;
    width: 25px;
    height: 39px;
    transform: translateX(-50%);
    transform-origin: bottom center;
    border-radius: 54% 46% 52% 48% / 65% 65% 35% 35%;
    background: radial-gradient(ellipse at 50% 72%, #fff8bd 0 18%, #ffd34d 35%, #ff8b1e 64%, #f34a1f 100%);
    box-shadow: 0 0 10px #ffac32, 0 0 28px rgba(255,153,31,.8), 0 0 45px rgba(255,124,22,.4);
    animation: flicker .18s ease-in-out infinite alternate;
}

.flame::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 9px;
    height: 16px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #fffbed;
    opacity: .92;
}

@keyframes flicker {
    from { transform: translateX(-50%) rotate(-3deg) scale(1, .96); }
    to { transform: translateX(-50%) rotate(3deg) scale(.93, 1.08); }
}

.flame.blowing { animation: blow .65s ease-out forwards; }

@keyframes blow {
    0% { opacity: 1; transform: translateX(-50%) rotate(0) scale(1); }
    38% { opacity: .82; transform: translateX(-105%) rotate(-32deg) scaleX(1.65) scaleY(.55); }
    100% { opacity: 0; transform: translateX(-155%) rotate(-45deg) scale(0); }
}

.flame.relight { animation: relight .7s cubic-bezier(.2,.9,.3,1.2) forwards; }

@keyframes relight {
    0% { opacity: 0; transform: translateX(-50%) scale(0); }
    55% { opacity: 1; transform: translateX(-50%) scale(1.38); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
}

button {
    margin-top: 5px;
    border: 0;
    border-radius: 999px;
    padding: 15px 28px;
    color: #fff;
    font: 700 1.08rem Arial, sans-serif;
    cursor: pointer;
    background: linear-gradient(135deg, #d71a62, #f34d88);
    box-shadow: 0 8px 0 #a6124a, 0 14px 23px rgba(111, 22, 54, .28);
    transition: transform .16s ease, box-shadow .16s ease;
}

button:hover { transform: translateY(-2px); }
button:active { transform: translateY(5px); box-shadow: 0 3px 0 #a6124a, 0 7px 12px rgba(111, 22, 54, .25); }

.message {
    min-height: 46px;
    margin-top: 19px;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(102, 24, 54, .3);
}

.celebration {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-content: center;
    padding: 24px;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    background: rgba(111, 23, 62, .38);
    backdrop-filter: blur(7px);
    transition: opacity .65s ease, visibility .65s ease;
}

.celebration.show {
    opacity: 1;
    visibility: visible;
}

.celebration-card {
    max-width: 700px;
    padding: clamp(28px, 6vw, 60px);
    border: 2px solid rgba(255,255,255,.5);
    border-radius: 32px;
    background: linear-gradient(145deg, rgba(255,255,255,.27), rgba(255,255,255,.12));
    box-shadow: 0 24px 70px rgba(68, 9, 38, .35);
}

.celebration h2 {
    margin: 0 0 14px;
    font-size: clamp(2.6rem, 8vw, 5.4rem);
    line-height: .95;
    text-shadow: 0 5px 18px rgba(81, 13, 44, .35);
}

.celebration p {
    margin: 0;
    font-size: clamp(1.2rem, 3.5vw, 1.8rem);
    font-weight: 700;
}

.explore-link {
    display: inline-block;
    margin-top: 22px;
    color: #fff;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 5px;
}

.take-me-there {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 30px;
    border-radius: 999px;
    color: #7d3c16;
    background: linear-gradient(135deg, #fff59e, #f7bf39);
    box-shadow: 0 7px 0 #c9871d, 0 13px 25px rgba(66, 26, 15, .25);
    font-weight: 800;
    text-decoration: none;
    transition: transform .16s ease;
}

.take-me-there:hover {
    transform: translateY(-3px) scale(1.03);
}

.heart, .confetti {
    position: fixed;
    pointer-events: none;
    z-index: 70;
}

.heart {
    animation: floatUp 5.5s linear forwards;
    filter: drop-shadow(0 3px 3px rgba(106, 17, 51, .22));
}

@keyframes floatUp {
    from { transform: translateY(110vh) rotate(0deg) scale(.5); opacity: 1; }
    to { transform: translateY(-14vh) rotate(30deg) scale(1.35); opacity: 0; }
}

.confetti {
    top: -20px;
    animation: fall 3.8s linear forwards;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(780deg); opacity: 0; }
}

@media (max-width: 540px) {
    .cake-scene {
        transform: scale(.8);
        margin: -36px auto -75px;
    }
}

@media (max-height: 760px) and (min-width: 541px) {
    .cake-scene {
        transform: scale(.82);
        margin: -35px auto -62px;
    }
}
</style>
</head>

<body>
<main class="container">
    <h1>Blow the Candles, Miss ♥</h1>
    <p class="subtitle">Make a wish, then give the candles your biggest blow ♥</p>

    <div class="cake-scene" aria-label="Three-tier birthday cake with candles">
        <div class="plate-shadow"></div>
        <div class="plate"></div>

        <div class="tier tier-bottom"></div>
        <div class="tier tier-middle"></div>
        <div class="tier tier-top"></div>

        <div class="frosting frosting-bottom"></div>
        <div class="frosting frosting-middle"></div>
        <div class="frosting frosting-top"></div>

        <div class="drip-line drip-bottom"></div>
        <div class="drip-line drip-middle"></div>
        <div class="drip db1"></div>
        <div class="drip db2"></div>
        <div class="drip db3"></div>
        <div class="drip dm1"></div>
        <div class="drip dm2"></div>

        <div class="pearls pearls-bottom">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="pearls pearls-middle">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <div class="pearls pearls-top">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="strawberry s1"></div>
        <div class="strawberry s2"></div>
        <div class="strawberry s3"></div>
        <div class="macaron m1"></div>
        <div class="macaron m2"></div>
        <div class="gold-dot g1"></div>
        <div class="gold-dot g2"></div>
        <div class="gold-dot g3"></div>
        <div class="gold-dot g4"></div>

        <div class="candle c1"><div class="wick"></div><div class="flame"></div></div>
        <div class="candle c2"><div class="wick"></div><div class="flame"></div></div>
        <div class="candle c3"><div class="wick"></div><div class="flame"></div></div>
    </div>

    <button id="blowButton" type="button">Blow the candles ♥</button>
    <div class="message" id="message" aria-live="polite"></div>
</main>

<section class="celebration" id="celebration" aria-live="polite">
    <div class="celebration-card">
        <h2>Happy Birthday! ♥</h2>
        <p>Wishing you a very, very happy birthday, my love ♥</p>

        <a class="explore-link" href="https://amisha.app/bday">
            Let’s explore the sunflower universe ♥
        </a>

        <br>

        <a class="take-me-there" href="https://amisha.app/bday">
            Take me there
        </a>
    </div>
</section>

<script>
const flames = [...document.querySelectorAll(".flame")];
const button = document.getElementById("blowButton");
const message = document.getElementById("message");
const celebration = document.getElementById("celebration");

let attempts = 0;
let celebrating = false;

button.addEventListener("click", () => {
    if (celebrating) return;

    attempts++;
    flames.forEach(flame => flame.classList.add("blowing"));

    if (attempts === 1) {
        message.textContent = "Ooh, they almost went out... blow harder, miss ♥";
        button.disabled = true;
        setTimeout(relightCandles, 760);

    } else if (attempts === 2) {
        message.textContent = "They lit up again! One huge blow this time ♥";
        button.disabled = true;
        setTimeout(relightCandles, 760);

    } else {
        message.textContent = "You did it, my love ♥";
        button.style.display = "none";

        setTimeout(() => {
            flames.forEach(flame => flame.style.display = "none");
            startCelebration();
        }, 680);
    }
});

function relightCandles() {
    flames.forEach(flame => {
        flame.classList.remove("blowing");
        flame.classList.add("relight");

        setTimeout(() => flame.classList.remove("relight"), 710);
    });

    button.disabled = false;
}

function startCelebration() {
    celebrating = true;
    celebration.classList.add("show");

    for (let i = 0; i < 45; i++) {
        setTimeout(createConfetti, i * 35);
    }

    setInterval(createHeart, 180);
    setInterval(createConfetti, 90);
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "♥";
    heart.style.left = `${Math.random() * 100}vw`;
    heart.style.fontSize = `${20 + Math.random() * 34}px`;
    heart.style.color = ["#ffffff", "#ff2d75", "#ffd0df", "#ffecf4"][Math.floor(Math.random() * 4)];

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5500);
}

function createConfetti() {
    const piece = document.createElement("div");
    piece.className = "confetti";

    const colors = ["#ffffff", "#ffd24a", "#ff3d7f", "#7d4dce", "#56d6c8", "#ff8b3d"];
    const size = 7 + Math.random() * 10;

    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.width = `${size}px`;
    piece.style.height = `${size * (0.55 + Math.random() * 0.75)}px`;
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    piece.style.animationDuration = `${2.6 + Math.random() * 2}s`;

    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4700);
}
</script>
</body>
</html>
